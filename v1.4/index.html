<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Online Shop | Chaotic Commissary</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://unpkg.com/@phosphor-icons/web"></script>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
            
            body {
                font-family: 'JetBrains Mono', monospace;
                background-color: #05001F;
                color: #e2e8f0;
                overflow-x: hidden;
            }

            .bg-logo {
                position: fixed;
                width: 1000px;
                height: 1000px;
                background-image: url('logo.png');
                background-size: contain;
                background-repeat: no-repeat;
                background-position: bottom right;
                opacity: 0.15;
                z-index: -1;
                pointer-events: none;
                bottom: 0;
                right: 0;
            }

            /* Custom Scrollbar */
            ::-webkit-scrollbar { width: 8px; }
            ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
            ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
            ::-webkit-scrollbar-thumb:hover { background: #60a5fa; }
        </style>
    </head>
    <body class="relative min-h-screen w-full pb-20">
        <div class="bg-logo"></div>

        <!-- Navigation Header -->
        <header class="w-full p-6 flex justify-between items-start z-10 bg-slate-900/80 backdrop-blur-md sticky top-0 border-b border-blue-900/50 shadow-lg">
            <div>
                <h1 class="text-4xl md:text-5xl font-extrabold text-blue-400 tracking-tight mb-2 uppercase drop-shadow-md">
                    Chaotic Commissary
                </h1>
                <p class="text-slate-400 text-sm md:text-lg tracking-widest uppercase">
                    Your Online Shop for Chaotically Good Items
                </p>
            </div>
            
            <button onclick="toggleCart()" class="relative bg-blue-600 hover:bg-blue-500 text-white p-4 rounded-xl shadow-lg transition-all flex items-center gap-2 group">
                <i class="ph ph-shopping-cart text-3xl"></i>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold w-7 h-7 flex items-center justify-center rounded-full border-2 border-[#05001F]">0</span>
            </button>
        </header>

        <!-- Main Product Grid -->
        <main class="max-w-7xl mx-auto p-6 mt-8">
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Products loaded via Firebase -->
                <div class="col-span-full text-center text-slate-500 py-12 animate-pulse">Loading inventory...</div>
            </div>
        </main>

        <footer class="absolute bottom-0 w-full p-6 text-center text-slate-400 text-sm border-t border-slate-800">
            &copy; 2026 Chaotic Commissary. All rights reserved.
            <a href="dash.html" class="text-blue-400 hover:underline ml-4">Admin Dashboard</a>
        </footer>

        <!-- Cart Slide-Over -->
        <div id="cart-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden transition-opacity" onclick="toggleCart()"></div>
        <div id="cart-panel" class="fixed top-0 right-0 h-full w-full md:w-[450px] bg-slate-900 border-l border-slate-700 shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-900">
                <h2 class="text-2xl font-bold text-white flex items-center gap-2"><i class="ph ph-shopping-cart"></i> Your Cart</h2>
                <button onclick="toggleCart()" class="text-slate-400 hover:text-white transition-colors"><i class="ph ph-x text-2xl"></i></button>
            </div>
            
            <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4">
                <div class="text-slate-500 text-center py-10 italic">Your cart is empty.</div>
            </div>

            <!-- Checkout Section -->
            <div class="p-6 bg-slate-800 border-t border-slate-700">
                <div class="flex justify-between items-center mb-6 text-xl font-bold">
                    <span class="text-slate-300">Total</span>
                    <span id="cart-total" class="text-blue-400">$0.00</span>
                </div>

                <form id="checkout-form" class="space-y-4" onsubmit="processCheckout(event)">
                    <div>
                        <input type="text" id="cust-name" required placeholder="Full Name" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 placeholder-slate-500">
                    </div>
                    <div class="flex gap-4">
                        <input type="tel" id="cust-phone" required placeholder="Phone Number" class="w-1/2 px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 placeholder-slate-500">
                        <input type="email" id="cust-email" required placeholder="Email Address" class="w-1/2 px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 placeholder-slate-500">
                    </div>
                    <button type="submit" id="checkout-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg transition-colors flex justify-center items-center gap-2 mt-4 disabled:opacity-50 disabled:cursor-not-allowed">
                        Place Order for Pickup
                    </button>
                </form>
            </div>
        </div>

        <!-- Success Modal -->
        <div id="success-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[60] hidden flex-col justify-center items-center p-6 text-center">
            <i class="ph-fill ph-check-circle text-7xl text-emerald-400 mb-6 drop-shadow-[0_0_15px_rgba(52,211,153,0.5)]"></i>
            <h2 class="text-4xl font-extrabold text-white mb-2 uppercase">Order Received!</h2>
            <p class="text-xl text-slate-300 mb-8">Your items are being gathered.</p>
            
            <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl max-w-md w-full shadow-2xl">
                <p class="text-slate-400 uppercase tracking-widest text-sm mb-2">Estimated Pickup Time</p>
                <div id="pickup-time-display" class="text-4xl font-bold text-blue-400 mb-6 font-mono">--:--</div>
                
                <p class="text-slate-400 text-sm mb-6">Order ID: <span id="success-order-id" class="font-mono text-white"></span></p>
                
                <button onclick="closeSuccessModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg transition-colors">
                    Continue Shopping
                </button>
            </div>
        </div>

        <!-- Global Toast -->
        <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-24 opacity-0 bg-slate-800 text-white px-6 py-3 rounded-xl shadow-2xl font-medium z-[70] flex items-center gap-3 border border-slate-700 transition-all duration-300">
            <i id="toast-icon" class="ph ph-info text-xl"></i>
            <span id="toast-msg">Message</span>
        </div>

        <!-- Firebase & App Logic -->
        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
            import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
            import { getFirestore, collection, doc, getDocs, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-pos-app';
            const firebaseConfig = {
                apiKey: "AIzaSyDuFg74Dvh8FydVdnvKlhShWTHq7SZASC0",
                authDomain: "chaotic-commissary.firebaseapp.com",
                projectId: "chaotic-commissary",
                storageBucket: "chaotic-commissary.firebasestorage.app",
                messagingSenderId: "282428310882",
                appId: "1:282428310882:web:226ebc367cc69c296cd83b",
                measurementId: "G-9S32HHN1Y2"
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            const inventoryRef = collection(db, 'artifacts', appId, 'public', 'data', 'inventory');
            const receiptsRef = collection(db, 'artifacts', appId, 'public', 'data', 'receipts');

            let inventory = [];
            let cart = [];

            // UI Helpers
            window.showToast = (message, type = 'info') => {
                const toast = document.getElementById('toast');
                document.getElementById('toast-msg').textContent = message;
                toast.className = `fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 text-white px-6 py-3 rounded-xl shadow-2xl font-medium z-[70] flex items-center gap-3 border transition-all duration-300 ${type === 'error' ? 'bg-red-600 border-red-500' : 'bg-emerald-600 border-emerald-500'}`;
                setTimeout(() => toast.classList.replace('translate-y-0', 'translate-y-24'), 3000);
                setTimeout(() => toast.classList.replace('opacity-100', 'opacity-0'), 3000);
            };

            window.toggleCart = () => {
                const panel = document.getElementById('cart-panel');
                const overlay = document.getElementById('cart-overlay');
                if (panel.classList.contains('translate-x-full')) {
                    panel.classList.remove('translate-x-full');
                    overlay.classList.remove('hidden');
                } else {
                    panel.classList.add('translate-x-full');
                    overlay.classList.add('hidden');
                }
            };

            const formatMoney = (amt) => `$${parseFloat(amt).toFixed(2)}`;

            // Init App
            async function initShop() {
                try {
                    await signInAnonymously(auth);
                    await fetchInventory();
                } catch (error) {
                    console.error("Init Error:", error);
                    document.getElementById('product-list').innerHTML = `<div class="col-span-full text-center text-red-500 py-12">Failed to load shop data. Please try again later.</div>`;
                }
            }

            async function fetchInventory() {
                const snapshot = await getDocs(inventoryRef);
                inventory = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    // Optional: only show items with stock > 0, or show all
                    inventory.push({ id: doc.id, ...data });
                });
                renderProducts();
            }

            function renderProducts() {
                const grid = document.getElementById('product-list');
                grid.innerHTML = '';
                
                if (inventory.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center text-slate-500 py-12">No products available at this time.</div>';
                    return;
                }

                inventory.forEach(item => {
                    // Calculate active price based on modifiers (mimicking admin logic)
                    let finalPrice = item.price;
                    if (item.modifier && item.modifier.active) {
                        if (item.modifier.type === 'percent') finalPrice = item.price * (1 + (item.modifier.value / 100));
                        else if (item.modifier.type === 'flat') finalPrice = item.price + item.modifier.value;
                        finalPrice = Math.max(0, finalPrice);
                    }

                    const outOfStock = (item.stock || item.floorStock + item.backroomStock) <= 0 && !item.isBundle;

                    const card = document.createElement('div');
                    card.className = "bg-slate-800/50 border border-slate-700/50 p-5 rounded-2xl flex flex-col hover:bg-slate-800 transition-colors shadow-lg backdrop-blur-sm";
                    card.innerHTML = `
                        <!-- New Image Container -->
                        <div class="h-48 w-full bg-slate-900 rounded-xl mb-4 overflow-hidden flex items-center justify-center border border-slate-700/50">
                            ${item.imageUrl 
                                ? `<img src="${item.imageUrl}" alt="${item.name}" class="object-cover h-full w-full hover:scale-105 transition-transform duration-300">` 
                                : `<i class="ph ph-image text-5xl text-slate-700"></i>`
                            }
                        </div>
                        
                        <!-- Existing Details -->
                        <div class="flex-1">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-lg text-white leading-tight">${item.name}</h3>
                                <span class="bg-slate-900 border border-blue-900 text-blue-400 px-2 py-1 rounded text-sm font-bold font-mono">${formatMoney(finalPrice)}</span>
                            </div>
                            <p class="text-xs text-slate-500 font-mono mb-4">SKU: ${item.sku}</p>
                        </div>
                        <button onclick="addToCart('${item.sku}', ${finalPrice})" 
                            class="w-full py-3 rounded-lg font-bold transition-all flex justify-center items-center gap-2 ${outOfStock ? 'bg-slate-700 text-slate-500 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-500 text-white shadow-md'}"
                            ${outOfStock ? 'disabled' : ''}>
                            <i class="ph ${outOfStock ? 'ph-prohibit' : 'ph-shopping-cart-simple'} text-xl"></i>
                            ${outOfStock ? 'Out of Stock' : 'Add to Cart'}
                        </button>
                    `;
                    grid.appendChild(card);
                });
            }

            // Cart Logic
            window.addToCart = (sku, price) => {
                const item = inventory.find(i => i.sku === sku);
                if (!item) return;

                const existing = cart.find(i => i.sku === sku);
                if (existing) existing.qty += 1;
                else cart.push({ sku: item.sku, name: item.name, price: price, qty: 1 });

                updateCartUI();
                showToast(`Added ${item.name} to cart`, 'success');
            };

            window.updateItemQty = (sku, change) => {
                const item = cart.find(i => i.sku === sku);
                if (!item) return;
                
                item.qty += change;
                if (item.qty <= 0) cart = cart.filter(i => i.sku !== sku);
                
                updateCartUI();
            };

            function updateCartUI() {
                const container = document.getElementById('cart-items');
                const countBadge = document.getElementById('cart-count');
                const totalDisplay = document.getElementById('cart-total');
                const checkoutBtn = document.getElementById('checkout-btn');

                const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
                const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

                countBadge.textContent = totalItems;
                totalDisplay.textContent = formatMoney(totalPrice);
                checkoutBtn.disabled = cart.length === 0;

                if (cart.length === 0) {
                    container.innerHTML = '<div class="text-slate-500 text-center py-10 italic">Your cart is empty.</div>';
                    return;
                }

                container.innerHTML = cart.map(item => `
                    <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl flex justify-between items-center">
                        <div class="flex-1">
                            <h4 class="font-bold text-white text-sm">${item.name}</h4>
                            <div class="text-blue-400 font-mono text-sm">${formatMoney(item.price)}</div>
                        </div>
                        <div class="flex items-center gap-3 bg-slate-800 rounded-lg p-1 border border-slate-700">
                            <button onclick="updateItemQty('${item.sku}', -1)" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-700 rounded transition-colors"><i class="ph ph-minus"></i></button>
                            <span class="font-bold text-white w-4 text-center">${item.qty}</span>
                            <button onclick="updateItemQty('${item.sku}', 1)" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-700 rounded transition-colors"><i class="ph ph-plus"></i></button>
                        </div>
                    </div>
                `).join('');
            }

            // Checkout Logic
            window.processCheckout = async (e) => {
                e.preventDefault();
                if (cart.length === 0) return;

                const btn = document.getElementById('checkout-btn');
                btn.disabled = true;
                btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Processing...';

                const name = document.getElementById('cust-name').value.trim();
                const phone = document.getElementById('cust-phone').value.trim();
                const email = document.getElementById('cust-email').value.trim();
                
                const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
                const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
                
                // Calculate Pickup Time (5 min per item)
                const waitTimeMinutes = totalItems * 5;
                const pickupDate = new Date();
                pickupDate.setMinutes(pickupDate.getMinutes() + waitTimeMinutes);

                // Flatten cart into individual receipt items to ensure compatibility with Admin Returns logic
                const receiptItems = [];
                cart.forEach(cartItem => {
                    for(let i=0; i < cartItem.qty; i++) {
                        receiptItems.push({ sku: cartItem.sku, name: cartItem.name, price: cartItem.price });
                    }
                });

                const orderData = {
                    timestamp: serverTimestamp(),
                    type: 'online_order',
                    status: 'pending_pickup',
                    customer: { name, phone, email },
                    items: receiptItems,
                    total: totalPrice,
                    pickupTime: pickupDate.toISOString(),
                    payments: [{ method: 'ONLINE', amount: totalPrice }] // Assuming paid online
                };

                try {
                    const newDocRef = doc(receiptsRef);
                    await setDoc(newDocRef, orderData);

                    // Show Success
                    toggleCart();
                    document.getElementById('success-order-id').textContent = newDocRef.id;
                    
                    // Format time like "2:45 PM"
                    const timeStr = pickupDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
                    document.getElementById('pickup-time-display').textContent = timeStr;
                    
                    document.getElementById('success-modal').classList.remove('hidden');
                    document.getElementById('success-modal').classList.add('flex');

                    // Reset Cart & Form
                    cart = [];
                    updateCartUI();
                    e.target.reset();

                } catch (error) {
                    console.error(error);
                    showToast("Failed to place order. Please try again.", "error");
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = 'Place Order for Pickup';
                }
            };

            window.closeSuccessModal = () => {
                document.getElementById('success-modal').classList.add('hidden');
                document.getElementById('success-modal').classList.remove('flex');
            };

            // Boot
            window.addEventListener('DOMContentLoaded', initShop);
        </script>
    </body>
</html>
